services:
  - type: web
    name: swiftship-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # set manually in the Render dashboard (your Neon connection string)
      - key: JWT_SECRET
        generateValue: true # Render generates a strong random secret automatically
      - key: CORS_ORIGIN
        sync: false # set to your deployed frontend URL after the static site is created

  - type: web
    name: swiftship-web
    runtime: static
    rootDir: client
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false # set to https://swiftship-api.onrender.com/api (your backend URL + /api)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html # SPA client-side routing support
